services:
  php:
    build: .
    container_name: maestrosdelamor
    volumes:
      - ./public:/var/www/html/maestrosdelamor/public
      - ./app:/var/www/html/maestrosdelamor/app
      - ./storage:/var/www/html/maestrosdelamor/storage
    ports:
        - "80:80"
        - "443:443"
    extra_hosts:
      - "maestrosdelamor.local:127.0.0.1"
      - "www.maestrosdelamor.local:127.0.0.1"
    # depends_on:
    #   - mysql
    env_file:
      - .env
    restart: always

