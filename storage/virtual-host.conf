# Redirigir todo HTTP a HTTPS
<VirtualHost *:80>
    ServerName maestrosdelamor.local
    ServerAlias www.maestrosdelamor.local localhost
    DocumentRoot /var/www/html/maestrosdelamor/public

    # Redirección permanente a HTTPS manteniendo el host
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

# VirtualHost HTTPS
<VirtualHost *:443>
    ServerName maestrosdelamor.local
    ServerAlias www.maestrosdelamor.local localhost
    DocumentRoot /var/www/html/maestrosdelamor/public
    
    # Carpeta pública
    <Directory /var/www/html/maestrosdelamor/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Bloquear /app
    <DirectoryMatch "/var/www/html/maestrosdelamor/app">
        Require all denied
    </DirectoryMatch>

    <Directory "/var/www/html/maestrosdelamor/storage">
        Require all denied
    </Directory>

    # Seguridad: Bloquear acceso a archivos sensibles
    <FilesMatch "\.(env|ini|log|sh|sql|git|gitignore|gitattributes|htaccess|htpasswd|yml|yaml|json|md|bak|dist|lock|phar|swp|swo)$">
        Require all denied
    </FilesMatch>

    <FilesMatch "^(error_log|error\.log|access\.log)$">
        Require all denied
    </FilesMatch>

    <FilesMatch "^(config\.php|composer\.(json|lock)|Dockerfile|docker-compose\.(yml|yaml)|\.editorconfig|Makefile)$">
        Require all denied
    </FilesMatch>

    # Procesar robots y sitemap con PHP para usar variables de entorno
    RewriteRule ^robots\.txt$ robots.php [L]
    RewriteRule ^sitemap\.xml$ sitemap.php [L]

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/maestrosdelamor_error.log
    CustomLog ${APACHE_LOG_DIR}/maestrosdelamor_access.log combined
    
    # Activar HSTS para un año y para todos los subdominios
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Headers de seguridad
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # SSL con certificados propios
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/maestrosdelamor.crt
    SSLCertificateKeyFile /etc/ssl/private/maestrosdelamor.key
</VirtualHost>
